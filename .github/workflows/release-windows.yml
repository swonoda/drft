name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v)'
        required: true
        default: '0.5.1'
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release version
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $version) { throw 'Version does not match package.json' }
          if (!(Test-Path "docs/releases/v$version.md")) { throw 'Release notes are missing' }
          gh release view "v$version" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite it' }
          $global:LASTEXITCODE = 0
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --publish never
      - name: Verify packaged files
        run: node scripts/verify-windows-package.cjs
      - name: Assemble release ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $setup = "dist/DRFT Setup $version.exe"
          $portable = "dist/DRFT $version.exe"
          foreach ($file in @($setup, $portable)) {
            if (!(Test-Path $file)) { throw "Missing executable: $file" }
          }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $setup, $portable release/
          Copy-Item scripts/setup-ocr.cjs release/setup-proof.cjs
          Copy-Item "docs/releases/v$version.md" release/RELEASE-NOTES.md
          Compress-Archive -Path release/* -DestinationPath "dist/DRFT_v$version.zip"
      - name: Publish release
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          gh release create $tag --draft --target $env:GITHUB_SHA --title "DRFT_$tag" --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          gh release upload $tag "dist/DRFT_$tag.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload ZIP; release remains draft' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
